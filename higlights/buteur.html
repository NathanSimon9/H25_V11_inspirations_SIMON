<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Buteurs All-Time</title>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#eef2f7; margin:0; padding:0; }
header { background:#1f2937; color:white; padding:15px 20px; text-align:center; font-size:1.6em; box-shadow:0 3px 6px rgba(0,0,0,0.1);}
main { padding:25px; max-width:900px; margin:auto; }
h2 { color:#111827; margin-bottom:20px; }
table { border-collapse: collapse; width:100%; margin-top:15px; background:white; border-radius:10px; overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
th, td { padding:12px; text-align:center; border-bottom:1px solid #e5e7eb; }
th { background:#3b82f6; color:white; }
tr:hover { background:#f3f4f6; }
a { margin-bottom:20px; background:#3b82f6; color:white; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; transition:0.2s;text-decoration: none; }
a:hover { background:#2563eb; }
</style>
</head>
<body>

<header>Buteurs All-Time</header>
<main>
<a href="index (1).html">Retour à la page d'acceuil</a>
<table id="tableButeursAllTime">
<tr><th>Joueur</th><th>Équipe</th><th>Ligue</th><th>Buts</th></tr>
</table>
</main>

<script>
// Récupérer toutes les ligues depuis localStorage
let ligues = JSON.parse(localStorage.getItem('ligues')) || [];
let joueursAllTime = [];

// Parcourir toutes les ligues et joueurs
ligues.forEach(l=>{
  l.joueurs.forEach(j=>{
    joueursAllTime.push({nom:j.nom,equipe:j.equipe,ligue:l.nom,buts:j.buts});
  });
});

// Trier par nombre de buts décroissant
joueursAllTime.sort((a,b)=>b.buts - a.buts);

// Remplir le tableau
let table=document.getElementById("tableButeursAllTime");
joueursAllTime.forEach(j=>{
  let row=table.insertRow();
  row.insertCell(0).innerText=j.nom;
  row.insertCell(1).innerText=j.equipe;
  row.insertCell(2).innerText=j.ligue;
  row.insertCell(3).innerText=j.buts;
});
</script>

</body>
</html>
